# Supply-chain policy for the ROCKY workspace.
#
# Enforced by `.github/workflows/ci.yml`. Advisories are deliberately NOT
# checked here: the `audit` job already runs `rustsec/audit-check`, and one
# enforcement point per control beats two that can disagree.
#
# Every entry below was derived from `cargo deny list --layout license`
# against the committed `Cargo.lock` on 2026-09-06, not copied from a
# template. Re-run that command when the lockfile changes.

[graph]
# Check the whole lockfile, every platform. A GPL crate that only builds on
# Linux is still a licensing problem for a project that ships on Linux.
all-features = false

[licenses]
version = 2
# Permissive only. Ordered as the inventory reports them, with the crates
# that force each entry named, so a reviewer can tell which lines are load
# bearing and which are inherited from a dual license.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  # subtle: BSD-3-Clause only.
  "BSD-3-Clause",
  "0BSD",
  # libloading, untrusted, rustls-webpki: ISC only.
  "ISC",
  "Unlicense",
  # foldhash: Zlib only.
  "Zlib",
  "CC0-1.0",
  "MIT-0",
  # icu_* (19 crates, via idna -> url): Unicode-3.0 only.
  "Unicode-3.0",
  # webpki-roots: CDLA-Permissive-2.0 only.
  "CDLA-Permissive-2.0",
  # File-level copyleft, reached only through Tauri's WebView stack
  # (cssparser, cssparser-macros, selectors, dtoa-short) and `dirs-sys`
  # (option-ext). Accepted because MPL-2.0 obligations attach per file and
  # ROCKY modifies none of these; revisit if that ever stops being true.
  "MPL-2.0",
]
# Deliberately absent: LGPL-2.1-or-later. `r-efi` offers it, but it is
# triple-licensed (MIT OR Apache-2.0 OR LGPL-2.1-or-later) so the permissive
# option is taken. Keep it out of `allow` so a future single-licensed LGPL
# crate fails CI instead of arriving silently.

# The 13 `rocky-*` crates carry no `license` field because none is published.
# Ignoring them here keeps the check about third-party obligations; it is not
# a substitute for choosing a project license.
private = { ignore = true }

[bans]
# Tauri's tree legitimately carries many duplicate majors (five `windows-sys`
# lines, three `toml`). Denying duplicates would report the framework's
# internals as ROCKY defects, which is noise, not a control.
multiple-versions = "allow"
# The project pins deliberately (see docs/plans/DEPENDENCY_REVIEW.md), so a
# `*` requirement is always a mistake. Intra-workspace `path` dependencies
# carry no version requirement and would otherwise all report as wildcards.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Everything must come from crates.io. A git or vendored dependency is a
# trust decision that has to be made explicitly, not merged quietly.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

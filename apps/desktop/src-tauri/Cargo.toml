[package]
name = "rocky-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Weighed justification (2026-09-05): this crate IS the Tauri shell, so the
# framework dependency is the product, not incidental weight. Everything
# else stays narrow: serde for typed command DTOs, core crates for the
# authorization boundary the adapters call into.
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rocky-domain = { path = "../../../crates/rocky-domain" }
rocky-ipc = { path = "../../../crates/rocky-ipc" }
rocky-runtime = { path = "../../../crates/rocky-runtime" }
rocky-storage = { path = "../../../crates/rocky-storage" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
